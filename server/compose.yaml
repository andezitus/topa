services:
  practice:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_PATH: /data/practice.sqlite
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - practice-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
volumes:
  practice-data:
