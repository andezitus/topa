name: Import approved Anatoly audio into repository

on:
  push:
    branches:
      - localize-anatoly-mp3
    paths:
      - .github/workflows/import-anatoly-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-audio:
    if: github.ref == 'refs/heads/localize-anatoly-mp3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout approved preview branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check ffmpeg and Python
        run: |
          python3 --version
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 2
      - name: Download, validate and localize the 39 voice clips
        run: python3 scripts/import_anatoly_audio.py
      - name: Check imported assets and script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder=Path('work-assets/audio')
          manifest=json.loads((folder/'anatoly-integrity.json').read_text(encoding='utf-8'))
          assert manifest['count'] == 39
          assert len(manifest['files']) == 39
          assert [item['index'] for item in manifest['files']] == list(range(39))
          assert all((folder/f"{i}.mp3").stat().st_size > 1000 for i in range(39))
          assert "heygen.ai" not in Path('work-audio.js').read_text(encoding='utf-8')
          assert 'work-audio.js?v=5' in Path('index.html').read_text(encoding='utf-8')
          print('All 39 local assets and player references validated')
          PY
          node --check work-audio.js
          node --check work-course.js
      - name: Commit approved local MP3 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "topa-audio-localizer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work-assets/audio/ index.html work-audio.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Store 39 approved Anatoly MP3 files locally and use repository playback"
            git push origin HEAD:localize-anatoly-mp3
          fi
