name: Import flashcard MP3 into isolated demo
on:
  push:
    branches: [flashcard-audio-demo-20261115]
    paths:
      - .github/workflows/import-flashcard-audio.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout flashcard demo branch
        uses: actions/checkout@v4
        with:
          ref: flashcard-audio-demo-20261115
      - name: Install ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download and verify all 64 recorded flashcards
        run: python3 scripts/import_flashcard_audio.py
      - name: Commit MP3 exclusively to demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f flashcard-assets/audio
          if git diff --cached --quiet; then
            echo "Audio unchanged."
          else
            git commit -m "Demo: save 64 flashcard MP3 locally"
            git push origin HEAD:flashcard-audio-demo-20261115
          fi
