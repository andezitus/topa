<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 940" preserveAspectRatio="none" fill="none">
  <title>Городская стройка</title>
  <defs>
    <linearGradient id="tower" x2="0" y2="1">
      <stop stop-color="#c5dfff"/><stop offset=".73" stop-color="#d6e9ff"/><stop offset="1" stop-color="#eaf4ff" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="towerSide" x2="0" y2="1">
      <stop stop-color="#b9d6f7"/><stop offset="1" stop-color="#e0efff" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="haze" x2="0" y2="1">
      <stop stop-color="#e8f4ff" stop-opacity="0"/><stop offset="1" stop-color="#e8f4ff" stop-opacity=".72"/>
    </linearGradient>
    <pattern id="windows" width="20" height="28" patternUnits="userSpaceOnUse">
      <rect x="5" y="6" width="8" height="13" rx="1" fill="#f3f9ff" opacity=".76"/>
    </pattern>
    <pattern id="bricks" width="47" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 1h47M0 18h47M18 1v17m23 0v16" stroke="#f3f9ff" stroke-width="2.4"/>
    </pattern>
  </defs>

