    <path d="m393 136 33-22v15l-33 22Zm0 28 33-22v15l-33 22Zm0 28 33-22v15l-33 22Z" fill="#e7f3ff" opacity=".8"/>
    <path d="M463 368V204l22-12v176Z" fill="#d1e6ff"/>
    <path d="M275 279h205v96H275Z" fill="url(#haze)"/>
